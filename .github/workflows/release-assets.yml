name: Upload verified release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag with an audited digest receipt
        required: true
        type: string

permissions: {}
concurrency:
  group: audited-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 50
    outputs:
      draft: ${{ steps.receipt.outputs.draft }}
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
    steps:
      - name: Read the audited release recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: recipe
          sparse-checkout: .github/recovery
          persist-credentials: false
      - name: Select pinned source and Pages commits
        id: receipt
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          r=json.load(open('recipe/.github/recovery/receipts.json'))[os.environ['TAG']]
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              print('receipt_sha256='+hashlib.sha256(open('recipe/.github/recovery/receipts.json','rb').read()).hexdigest(),file=out)
              for key in ('source','pages','draft'):print(f'{key}={r[key]}',file=out)
          PY
      - name: Check out published Pages bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.receipt.outputs.pages }}
          path: pages
          persist-credentials: false
      - name: Check out the exact source packets and tag packager
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.receipt.outputs.source }}
          path: source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/package_static_site.py
            /src/app/scripts/offline-delta-selection.json
            /src/app/public/mesh/surrounding-berlin-v159/
          persist-credentials: false
      - name: Reconstruct all files and verify the three hashes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          curl -fLsS https://deb.debian.org/debian/pool/main/libd/libdeflate/libdeflate0_1.23-2_amd64.deb -o libdeflate.deb
          printf '%s  %s\n' 5fe37fb79d53f5c91da6ba3ac4c1a8453e1f2b1ff0e0ea45189c5338bbfdbf82 libdeflate.deb | sha256sum -c -
          dpkg-deb -x libdeflate.deb native
          mkdir work
          docker run --rm -v "$PWD:/job" -w /job -e TAG debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2 sh -ec '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends python3
            /usr/bin/python3 recipe/.github/recovery/rebuild.py "$TAG" source pages work/output native/usr/lib/x86_64-linux-gnu/libdeflate.so.0
            cp recipe/.github/recovery/receipts.json work/output/receipts.json
          '
      - name: Transfer candidate files to the isolated upload job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-files
          path: work/output/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  upload:
    needs: reconstruct
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-files
          path: files
      - name: Check hashes again and attach missing assets to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          DRAFT: ${{ needs.reconstruct.outputs.draft }}
          RECEIPT_SHA256: ${{ needs.reconstruct.outputs.receipt_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          repo=os.environ['REPO']; tag=os.environ['TAG']; draft=int(os.environ['DRAFT'])
          folder=pathlib.Path('files')
          record=(folder/'receipts.json').read_bytes()
          assert hashlib.sha256(record).hexdigest()==os.environ['RECEIPT_SHA256']
          receipt=json.loads(record)[tag]
          assert receipt['draft']==draft
          assets=receipt['sha256']
          assert set(p.name for p in folder.iterdir())==set(assets)|{'receipts.json'}
          assert len(assets)==3
          for name,expected in assets.items():
              p=folder/name
              assert p.name==name and p.is_file() and not p.is_symlink()
              with p.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==expected,name
          def read(endpoint):
              return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{endpoint}']))
          def get_draft():
              r=read(f'releases/{draft}')
              assert r['id']==draft and r['tag_name']==tag and r['draft'],(tag,draft)
              return {a['name']:a for a in r['assets']}
          tip=read('git/ref/tags/'+tag)['object']
          while tip['type']=='tag':tip=read('git/tags/'+tip['sha'])['object']
          assert tip['type']=='commit' and tip['sha']==receipt['source']
          existing=get_draft()
          def matches(info, filename):
              return (info['state']=='uploaded' and info['digest']=='sha256:'+assets[filename]
                      and info['size']==(folder/filename).stat().st_size)
          for n,info in existing.items():
              if n in assets:assert matches(info,n),f'conflicting existing asset: {n}'
          for n in assets:
              live=get_draft()
              if n in live:assert matches(live[n],n)
              else:subprocess.run(['gh','release','upload',tag,str(folder/n),'--repo',repo],check=True)
          final=get_draft()
          assert all(n in final and matches(final[n],n) for n in assets)
          print('Verified all three uploaded asset digests. Release remains a draft.')
          PY
